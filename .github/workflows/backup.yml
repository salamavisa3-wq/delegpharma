name: Backup Neon → GitHub Artifacts

# Backup quotidien du Postgres Neon (remplace le cron VPS 3h30). Upload en artifact
# GitHub Actions (rétention 14 jours) — repli sans carte : R2 bloqué sur ce compte.
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pg_dump
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Dump gzip
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          F="delegpharma-$(date +%F).sql.gz"
          pg_dump --no-owner --no-privileges -Fp "$NEON_DATABASE_URL" | gzip -9 > "$F"
          echo "BACKUP_FILE=$F" >> "$GITHUB_ENV"

      - name: Upload backup as artifact (rétention 14 j)
        uses: actions/upload-artifact@v4
        with:
          name: delegpharma-backups
          path: ${{ env.BACKUP_FILE }}
          if-no-files-found: error
          retention-days: 14
