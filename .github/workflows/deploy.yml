name: Deploy (Cloudflare Workers + Static Assets)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci --omit=dev

      # Init schéma idempotent SUR LE RUNNER (CPU illimité), jamais dans le Worker
      # (DDL multi-statement > 10 ms). Schéma SEUL par défaut : la base reste vierge
      # tant que migration-data.yml n'a pas restauré le dump prod.
      - name: Init schema (idempotent, Neon)
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: node scripts/schema-init.mjs

      - name: Deploy Worker + assets + KV
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          # Pin = version qui externalise node:sqlite (builtin Node, import dynamique
          # db.js jamais exécuté sous Neon mais résolu au build). Le défaut (3.90.0)
          # casse le bundle → épingle la 4.133.0 déjà validée en deploy manuel.
          wranglerVersion: 4.133.0
          command: deploy
