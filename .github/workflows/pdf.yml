name: "PDF CRV (génération asynchrone → KV)"

# pdfkit dépasse le budget CPU de 10 ms du Workers Free → génération ici (CPU illimité),
# upload KV (namespace delegpharma-pdfs, jamais public), l'URL est servie par le Worker (route /pdfs/*).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps (pdfkit, neon)
        working-directory: backend
        run: npm ci --omit=dev

      - name: Generate pending PDFs → KV
        working-directory: backend
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
        run: node src/pdf-job-runner.js
